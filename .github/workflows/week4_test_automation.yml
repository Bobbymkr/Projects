# Week 4: Enhanced CI/CD Test Integration
# Comprehensive test automation with coverage gates and performance regression detection

name: Week 4 - Test Automation & Quality Gates

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Daily test runs at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Run all test suites'
        required: false
        default: true
        type: boolean
      run_performance:
        description: 'Run performance benchmarks'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  COVERAGE_THRESHOLD: 95

jobs:
  # Unit Tests with Coverage Gate
  unit-tests:
    name: Unit Tests (Coverage Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install pytest pytest-cov pytest-xdist coverage[toml]
      
      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            -v \
            -n auto
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unit
          fail_ci_if_error: true
      
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            --maxfail=5
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: |
            .pytest_cache/
            test-results/

  # Load Tests
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event.inputs.run_performance == true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install locust requests
      
      - name: Start API server
        run: |
          python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
      
      - name: Run load tests
        run: |
          python tests/performance/enhanced_load_tests.py \
            --test gradual \
            --max-rps 500 \
            --duration 60 \
            --output load_test_results.json
      
      - name: Upload load test results
        uses: actions/upload-artifact@v3
        with:
          name: load-test-results
          path: load_test_results.json

  # Chaos Engineering Tests
  chaos-tests:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run chaos tests
        run: |
          python tests/chaos/chaos_engineering.py \
            --test all \
            --duration 20 \
            --output chaos_test_results.json
      
      - name: Upload chaos test results
        uses: actions/upload-artifact@v3
        with:
          name: chaos-test-results
          path: chaos_test_results.json

  # Performance Regression Detection
  performance-regression:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run benchmarks
        run: |
          python scripts/benchmark_all_technologies.py \
            --quick \
            --output current_benchmark.json
      
      - name: Compare with baseline
        run: |
          python scripts/analyze_benchmark_results.py \
            --compare results/benchmarks/baseline.json current_benchmark.json \
            --output performance_comparison.json || true
      
      - name: Check for regressions
        run: |
          python scripts/check_performance_regression.py \
            --baseline results/benchmarks/baseline.json \
            --current current_benchmark.json \
            --threshold 0.15 || exit 1
      
      - name: Upload performance comparison
        uses: actions/upload-artifact@v3
        with:
          name: performance-comparison
          path: performance_comparison.json

  # Test Summary Report
  test-summary:
    name: Test Summary Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, load-tests, chaos-tests]
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate test summary
        run: |
          python scripts/generate_test_summary.py \
            --output execution/reports/test_summary_${{ github.run_number }}.md
      
      - name: Upload test summary
        uses: actions/upload-artifact@v3
        with:
          name: test-summary
          path: execution/reports/test_summary_*.md

