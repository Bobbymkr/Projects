# Week 6: Prometheus Alert Rules

groups:
  - name: api_alerts
    interval: 30s
    rules:
      # High latency alert
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, http_request_duration_seconds_bucket) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency is {{ $value }}s (threshold: 0.1s)"

      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} (threshold: 0.05)"

      # Service down
      - alert: ServiceDown
        expr: up{job="adaptive-traffic-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "Adaptive Traffic API service is not responding"

  - name: traffic_alerts
    interval: 30s
    rules:
      # High wait time
      - alert: HighWaitTime
        expr: traffic_vehicle_wait_time_seconds > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High vehicle wait time"
          description: "Average wait time is {{ $value }}s (threshold: 60s)"

      # Queue overflow
      - alert: QueueOverflow
        expr: traffic_queue_length > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue overflow detected"
          description: "Queue length is {{ $value }} (threshold: 50)"

  - name: system_alerts
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: system_cpu_usage_percent > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: system_memory_usage_percent > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% (threshold: 85%)"

      # Low disk space
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10%"
