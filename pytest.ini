[pytest]
# Pytest configuration for Adaptive Traffic Control System

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=85
    --maxfail=5
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (moderate speed, component interactions)
    system: System tests (slower, end-to-end)
    performance: Performance and benchmark tests
    slow: Slow-running tests
    sumo: Tests requiring SUMO simulation
    vision: Vision processing tests
    rl: Reinforcement learning tests
    forecasting: Traffic forecasting tests
    robustness: Robustness and fault tolerance tests
    security: Security tests
    skip: Tests to skip

# Coverage options
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */build/*
    */dist/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
