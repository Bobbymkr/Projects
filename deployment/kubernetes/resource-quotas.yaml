# Resource Quotas and Limits
# Phase 4: Infrastructure Excellence

apiVersion: v1
kind: ResourceQuota
metadata:
  name: adaptive-traffic-quota
  namespace: default
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
    services.nodeports: "5"

---
# Limit Range for pods in namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: adaptive-traffic-limits
  namespace: default
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
    type: Container

