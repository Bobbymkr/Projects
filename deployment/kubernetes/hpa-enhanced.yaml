# Week 7: Enhanced Kubernetes HPA Configuration
# Auto-scaling based on custom metrics (inference latency, queue length)

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adaptive-traffic-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adaptive-traffic-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom metric: Inference latency
    - type: Pods
      pods:
        metric:
          name: system_inference_latency_seconds
        target:
          type: AverageValue
          averageValue: "0.05"  # 50ms target
    
    # Custom metric: Queue length
    - type: Pods
      pods:
        metric:
          name: traffic_queue_length
        target:
          type: AverageValue
          averageValue: "10"  # Target queue length
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

