# Week 7: Load Balancer Configuration (Nginx/Envoy)

apiVersion: v1
kind: Service
metadata:
  name: adaptive-traffic-lb
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
    - port: 443
      targetPort: 8000
      protocol: TCP
      name: https
  selector:
    app: adaptive-traffic-api
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

---
# Nginx Ingress Controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adaptive-traffic-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/health-check-path: "/health"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
spec:
  ingressClassName: nginx
  rules:
    - host: api.adaptive-traffic.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adaptive-traffic-lb
                port:
                  number: 80

