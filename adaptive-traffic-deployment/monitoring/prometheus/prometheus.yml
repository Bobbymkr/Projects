# Prometheus Configuration for Adaptive Traffic Control System
# Phase 1.2: Monitoring & Observability

global:
  scrape_interval: 15s  # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'adaptive-traffic'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts/*.yml'

# Scrape configurations
scrape_configs:
  # API Server Metrics
  - job_name: 'adaptive-traffic-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: 'api-server'
          component: 'backend'

  # System Metrics (via node_exporter if available)
  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'system'
          component: 'host'

  # PostgreSQL Metrics (if postgres_exporter available)
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9187']
        labels:
          service: 'database'
          component: 'postgresql'

  # Redis Metrics (if redis_exporter available)
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9121']
        labels:
          service: 'cache'
          component: 'redis'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

