# Secret Template for Helm Chart

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adaptive-traffic.fullname" . }}-secrets
  labels:
    {{- include "adaptive-traffic.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.secretKey }}
  secretKey: {{ .Values.secrets.secretKey | b64enc }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  databaseUrl: {{ .Values.secrets.databaseUrl | b64enc }}
  {{- end }}
  {{- if .Values.secrets.sentryDsn }}
  sentryDsn: {{ .Values.secrets.sentryDsn | b64enc }}
  {{- end }}

