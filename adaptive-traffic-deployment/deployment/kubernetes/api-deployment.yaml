# Kubernetes Deployment for Adaptive Traffic Control API
# Phase 4: Infrastructure Excellence

apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptive-traffic-api
  labels:
    app: adaptive-traffic-api
    component: backend
spec:
  replicas: 3  # Can be scaled horizontally
  selector:
    matchLabels:
      app: adaptive-traffic-api
  template:
    metadata:
      labels:
        app: adaptive-traffic-api
        component: backend
    spec:
      containers:
      - name: api
        image: adaptive-traffic-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: ENABLE_REDIS
          value: "true"
        - name: REDIS_HOST
          value: "redis-service"
        - name: ENABLE_CACHING
          value: "true"
        - name: ENABLE_RATE_LIMITING
          value: "true"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30

---
apiVersion: v1
kind: Service
metadata:
  name: adaptive-traffic-api-service
  labels:
    app: adaptive-traffic-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: adaptive-traffic-api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adaptive-traffic-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adaptive-traffic-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

