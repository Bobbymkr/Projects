<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495E"/>
    </marker>
    <style>
      .title{font-family:Segoe UI, Arial; font-size:26px; font-weight:bold; fill:#2C3E50}
      .label{font-family:Segoe UI, Arial; font-size:14px; fill:#2C3E50}
      .desc{font-family:Segoe UI, Arial; font-size:12px; fill:#566573}
      .group{stroke-width:2; rx:12}
      .arrow{stroke:#34495E; stroke-width:2; fill:none; marker-end:url(#arrow)}
      .configs{stroke:#9B59B6; fill:#F5EAF7}
      .perception{stroke:#4F8CFF; fill:#EAF2FF}
      .environment{stroke:#2ECC71; fill:#EAFBEA}
      .decision{stroke:#F39C12; fill:#FFF4E6}
      .control{stroke:#E74C3C; fill:#FDEDEC}
      .monitoring{stroke:#1ABC9C; fill:#E8FBF7}
      .tools{stroke:#7F8C8D; fill:#F7F9F9}
      .legend{stroke:#BDC3C7; fill:#FFFFFF}
    </style>
  </defs>

  <text x="600" y="40" text-anchor="middle" class="title">Adaptive Traffic — Architecture Overview</text>

  <rect x="930" y="60" width="240" height="170" class="legend group"/>
  <text x="945" y="85" class="label">Legend</text>
  <rect x="945" y="100" width="16" height="16" class="configs group"/><text x="965" y="112" class="desc">Scenarios/Settings</text>
  <rect x="945" y="120" width="16" height="16" class="perception group"/><text x="965" y="132" class="desc">Cameras & Counting</text>
  <rect x="945" y="140" width="16" height="16" class="environment group"/><text x="965" y="152" class="desc">Traffic Simulator</text>
  <rect x="945" y="160" width="16" height="16" class="decision group"/><text x="965" y="172" class="desc">Smart Decision Center</text>
  <rect x="945" y="180" width="16" height="16" class="control group"/><text x="965" y="192" class="desc">Signals Controller</text>
  <rect x="945" y="200" width="16" height="16" class="monitoring group"/><text x="965" y="212" class="desc">Monitoring</text>

  <rect x="40" y="60" width="330" height="70" class="configs group"/>
  <text x="55" y="90" class="label">Scenarios & Settings</text>
  <text x="55" y="110" class="desc">Lane plans, safe timings, rush-hour patterns</text>

  <rect x="40" y="150" width="330" height="220" class="perception group"/>
  <text x="55" y="180" class="label">Cameras & Counting</text>
  <text x="55" y="200" class="desc">Detect cars, estimate queues</text>
  <rect x="60" y="220" width="130" height="60" class="perception group"/>
  <text x="70" y="250" class="desc">Camera feeds</text>
  <rect x="200" y="220" width="150" height="60" class="perception group"/>
  <text x="210" y="250" class="desc">Vehicle detection</text>
  <rect x="60" y="290" width="290" height="60" class="perception group"/>
  <text x="70" y="320" class="desc">Queue estimation per lane</text>

  <rect x="40" y="390" width="330" height="200" class="environment group"/>
  <text x="55" y="420" class="label">Traffic Simulator</text>
  <text x="55" y="440" class="desc">Virtual roads, arrivals, waits</text>
  <rect x="60" y="460" width="290" height="60" class="environment group"/>
  <text x="70" y="490" class="desc">Intersection state (road conditions)</text>

  <rect x="400" y="180" width="360" height="360" class="decision group"/>
  <text x="415" y="210" class="label">Smart Decision Center</text>
  <text x="415" y="230" class="desc">Chooses next light change to reduce waits</text>
  <rect x="415" y="245" width="160" height="80" class="decision group"/>
  <text x="425" y="275" class="desc">AI brain (learns)</text>
  <rect x="415" y="335" width="160" height="80" class="decision group"/>
  <text x="425" y="365" class="desc">Forecast (near-future)</text>
  <rect x="585" y="290" width="160" height="80" class="decision group"/>
  <text x="595" y="320" class="desc">Helpful rules (Webster/Fuzzy)</text>
  <rect x="515" y="380" width="160" height="120" class="decision group"/>
  <text x="525" y="410" class="desc">Decision hub</text>
  <text x="525" y="435" class="desc">Combine inputs</text>
  <text x="525" y="460" class="desc">Pick best action</text>

  <rect x="790" y="220" width="360" height="280" class="control group"/>
  <text x="805" y="250" class="label">Signals Controller</text>
  <text x="805" y="270" class="desc">Applies safe green/red timings</text>
  <rect x="805" y="290" width="330" height="80" class="control group"/>
  <text x="815" y="320" class="desc">Intersection signal boxes</text>
  <rect x="805" y="380" width="330" height="80" class="control group"/>
  <text x="815" y="410" class="desc">Improved flow & shorter waits</text>

  <rect x="790" y="520" width="360" height="180" class="monitoring group"/>
  <text x="805" y="550" class="label">Monitoring & Dashboards</text>
  <text x="805" y="570" class="desc">Live metrics, health, reports</text>

  <rect x="400" y="560" width="360" height="140" class="tools group"/>
  <text x="415" y="590" class="label">Setup & Tests</text>
  <text x="415" y="615" class="desc">One-click setup, demos, automated checks</text>

  <line x1="370" y1="270" x2="400" y2="300" class="arrow"/>
  <text x="300" y="265" class="desc">Vehicle counts</text>
  <line x1="370" y1="490" x2="400" y2="300" class="arrow"/>
  <text x="300" y="485" class="desc">Road state</text>
  <line x1="580" y1="440" x2="790" y2="360" class="arrow"/>
  <text x="650" y="355" class="desc">Best next change</text>
  <line x1="205" y1="100" x2="205" y2="150" class="arrow"/>
  <text x="120" y="120" class="desc">Settings apply</text>
  <line x1="205" y1="100" x2="205" y2="390" class="arrow"/>
  <line x1="205" y1="100" x2="400" y2="180" class="arrow"/>
  <line x1="970" y1="500" x2="970" y2="440" class="arrow"/>
  <text x="980" y="485" class="desc">Results & logs</text>

  <text x="600" y="780" text-anchor="middle" class="desc">Goal: Smarter signals, safer roads, shorter waits</text>
</svg>