<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495E"/>
    </marker>
    <style>
      .title{font-family:Segoe UI, Arial; font-size:28px; font-weight:bold; fill:#2C3E50}
      .label{font-family:Segoe UI, Arial; font-size:16px; fill:#2C3E50}
      .desc{font-family:Segoe UI, Arial; font-size:14px; fill:#566573}
      .group{stroke-width:2; rx:12}
      .arrow{stroke:#34495E; stroke-width:2; fill:none; marker-end:url(#arrow)}
      .stakeholders{stroke:#4F8CFF; fill:#EAF2FF}
      .team{stroke:#9B59B6; fill:#F5EAF7}
      .system{stroke:#2ECC71; fill:#EAFBEA}
      .reports{stroke:#1ABC9C; fill:#E8FBF7}
      .legend{stroke:#BDC3C7; fill:#FFFFFF}
    </style>
  </defs>

  <text x="700" y="40" text-anchor="middle" class="title">Roles & Responsibilities — Simple Overview</text>

  <rect x="1080" y="60" width="280" height="160" class="legend group"/>
  <text x="1095" y="85" class="label">Legend</text>
  <rect x="1095" y="100" width="18" height="18" class="stakeholders group"/><text x="1120" y="114" class="desc">Stakeholders</text>
  <rect x="1095" y="125" width="18" height="18" class="team group"/><text x="1120" y="139" class="desc">Technical Team</text>
  <rect x="1095" y="150" width="18" height="18" class="system group"/><text x="1120" y="164" class="desc">System Components</text>
  <rect x="1095" y="175" width="18" height="18" class="reports group"/><text x="1120" y="189" class="desc">Metrics & Reports</text>

  <rect x="40" y="100" width="380" height="540" class="stakeholders group"/>
  <text x="60" y="130" class="label">Stakeholders</text>
  <rect x="60" y="150" width="340" height="60" class="stakeholders group"/><text x="70" y="180" class="desc">City Operator: monitors live performance</text>
  <rect x="60" y="215" width="340" height="60" class="stakeholders group"/><text x="70" y="245" class="desc">Traffic Manager: selects scenarios & goals</text>
  <rect x="60" y="280" width="340" height="60" class="stakeholders group"/><text x="70" y="310" class="desc">Safety Officer: enforces safe timings</text>
  <rect x="60" y="345" width="340" height="60" class="stakeholders group"/><text x="70" y="375" class="desc">Planner: tests changes in simulator</text>
  <rect x="60" y="410" width="340" height="60" class="stakeholders group"/><text x="70" y="440" class="desc">Data Analyst: reviews reports, KPIs</text>
  <rect x="60" y="475" width="340" height="60" class="stakeholders group"/><text x="70" y="505" class="desc">Compliance Officer: privacy & audits</text>
  <rect x="60" y="540" width="340" height="60" class="stakeholders group"/><text x="70" y="570" class="desc">Maintenance Staff: installs & updates</text>
  <rect x="60" y="605" width="340" height="60" class="stakeholders group"/><text x="70" y="635" class="desc">Citizens: benefit from shorter waits</text>

  <rect x="980" y="100" width="380" height="540" class="team group"/>
  <text x="1000" y="130" class="label">Technical Team</text>
  <rect x="1000" y="150" width="340" height="60" class="team group"/><text x="1010" y="180" class="desc">RL Engineer: trains decision models</text>
  <rect x="1000" y="215" width="340" height="60" class="team group"/><text x="1010" y="245" class="desc">Vision Engineer: vehicle detection</text>
  <rect x="1000" y="280" width="340" height="60" class="team group"/><text x="1010" y="310" class="desc">DevOps: deployment & uptime</text>
  <rect x="1000" y="345" width="340" height="60" class="team group"/><text x="1010" y="375" class="desc">QA: testing & quality checks</text>
  <rect x="1000" y="410" width="340" height="60" class="team group"/><text x="1010" y="440" class="desc">Security: validation & safe logging</text>
  <rect x="1000" y="475" width="340" height="60" class="team group"/><text x="1010" y="505" class="desc">Support: tools, maintenance</text>

  <rect x="460" y="160" width="480" height="360" class="system group"/>
  <text x="480" y="190" class="label">System Components</text>
  <rect x="480" y="210" width="200" height="80" class="system group"/><text x="490" y="240" class="desc">Perception (cameras)</text>
  <rect x="480" y="300" width="200" height="80" class="system group"/><text x="490" y="330" class="desc">Environment (simulator)</text>
  <rect x="740" y="210" width="180" height="80" class="system group"/><text x="750" y="240" class="desc">Decision Center</text>
  <rect x="740" y="300" width="180" height="80" class="system group"/><text x="750" y="330" class="desc">Controller (signals)</text>
  <rect x="600" y="390" width="200" height="100" class="system group"/><text x="610" y="420" class="desc">Monitoring & Metrics</text>

  <rect x="520" y="540" width="360" height="100" class="reports group"/>
  <text x="535" y="570" class="label">Metrics & Reports</text>
  <text x="535" y="595" class="desc">Wait time, queues, throughput, health</text>

  <line x1="420" y1="210" x2="460" y2="210" class="arrow"/>
  <text x="260" y="205" class="desc">Goals & scenarios</text>

  <line x1="420" y1="350" x2="460" y2="310" class="arrow"/>
  <text x="275" y="330" class="desc">Safety rules</text>

  <line x1="940" y1="190" x2="940" y2="220" class="arrow"/>
  <text x="875" y="200" class="desc">Models & deployment</text>

  <line x1="940" y1="350" x2="940" y2="380" class="arrow"/>
  <text x="875" y="360" class="desc">Testing & validation</text>

  <line x1="820" y1="450" x2="820" y2="540" class="arrow"/>
  <text x="830" y="500" class="desc">Results</text>

  <line x1="520" y1="590" x2="400" y2="590" class="arrow"/>
  <text x="430" y="580" class="desc">Dashboards & reports</text>

  <text x="700" y="870" text-anchor="middle" class="desc">Everyone contributes: safer, smoother traffic with clear visibility</text>
</svg>